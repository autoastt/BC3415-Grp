services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATA_DIR: /data
      TRUST_PROXY: "true"          # nginx sets X-Real-IP, used for per-IP rate limiting
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - scopeguard-data:/data      # ChromaDB, SQLite, settings survive restarts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  scopeguard-data:
